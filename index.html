<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LI ZHENG — Portfolio</title>

    <link rel="stylesheet" href="entry.css">

</head>


<body>

    <main class="entry-page" id="entryPage">

        <!-- =========================
             Door Scene
        ========================== -->

        <div class="entry-scene" id="entryScene">

            <img
                id="doorImage"
                class="door-image"
                src="images/entry/door-01.png"
                alt=""
            >

             <!-- Door opening GIF -->
             <img
                 id="doorHoverImage"
                 class="door-hover-image"
                 src=""
                 alt=""
             >

             <!-- Invisible hover area -->
             <div
                 id="doorHotspot"
                 class="door-hotspot"
             ></div>
            


            <!-- ENTRY button image -->

            <img
                id="entryButton"
                class="entry-button"
                src="images/entry/entry.png"
                alt="ENTRY"
            >

        </div>


        <!-- White transition -->

        <div
            class="white-transition"
            id="whiteTransition"
        ></div>


        <!-- Your portfolio homepage -->

        <iframe
            src="home.html"
            class="home-frame"
            id="homeFrame"
        ></iframe>

    </main>


    <script src="entry.js"></script>

</body>

</html>
